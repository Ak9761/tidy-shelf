  <style>

    .game { width:min(720px,100%); background:rgba(255,250,239,.94); border:4px solid rgba(255,255,255,.75); border-radius:29px; box-shadow:0 20px 52px #67443b55, inset 0 1px #fff; overflow:hidden; }

    @media (max-width:430px) { .stage { min-height:500px; padding:13px 9px; } .shelf { gap:6px; padding:12px 5px; border-width:9px; } .slot { min-height:80px; } .items { gap:5px; padding:8px 4px; } .toolbar { padding:11px; } .tip { max-width:190px; } header { padding:14px 11px 11px; } .pill { padding:5px 7px; } }

<body>
  <main class="game">
    <header><h1>Tidy <span>Shelf</span> ✿</h1><div class="stats"><div class="pill">Level <b id="level">1</b>/50</div><div class="pill">Score <b id="score">0</b></div><div class="pill">⏱ <b id="time">60</b>s</div></div></header>
    <section class="stage" id="stage">
      <div class="message" id="message">Match every treasure to its cozy shelf!</div>
      <div class="shelf" id="shelf" aria-label="shelf slots"></div>
      <div class="items" id="items" aria-label="items to tidy"></div>
      <div class="modal" id="modal"><div class="card"><div class="big">🧺</div><h2 id="modalTitle">Welcome!</h2><p id="modalText">Put each object on the shelf with the same picture. Complete all 50 levels — each gets a fresh 60 seconds!</p><button id="start">Start tidying</button></div></div>
    </section>
    <footer class="toolbar"><p class="tip">A cozy 50-level sorting game — drag items onto their matching shelf spaces.</p><button id="restart">↻ Restart</button></footer>
  </main>
  <script>
    const all = [
      ['🍓','Strawberry'],['🧸','Teddy'],['🌷','Tulip'],['🫖','Teapot'],['📚','Books'],['🕯️','Candle'],
      ['🍄','Mushroom'],['🧶','Yarn'],['🪴','Plant'],['🍪','Cookie'],['🎀','Bow'],['🧴','Lotion']
    ];
    // Fifty hand-mixed rounds: later levels use fuller shelves and new random layouts.
    const counts=Array.from({length:50},(_,i)=>Math.min(12,4+Math.floor(i/5)));
    const totalLevels=counts.length; let level=1, score=0, seconds=60, timer, active=false, dragged=null;
    const $=id=>document.getElementById(id); const shelf=$('shelf'), items=$('items'), message=$('message');
    function shuffle(a){ return [...a].sort(()=>Math.random()-.5); }
    function sound(type){ try { const c=new (window.AudioContext||window.webkitAudioContext)(), o=c.createOscillator(), g=c.createGain(); o.connect(g);g.connect(c.destination); o.type=type==='good'?'sine':'triangle';o.frequency.value=type==='good'?640:160;g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.start();o.stop(c.currentTime+.2); } catch(e){} }
    function render(){
      const chosen=shuffle(all).slice(0,counts[level-1]); shelf.innerHTML=''; items.innerHTML='';
      shuffle(chosen).forEach(([icon,name])=>{ const s=document.createElement('div');s.className='slot';s.dataset.key=icon;s.setAttribute('aria-label',name+' shelf slot');s.innerHTML='<span style="font-size:clamp(1.5rem,6vw,2.7rem);opacity:.55">'+icon+'</span>'; shelf.append(s); });
      shuffle(chosen).forEach(([icon,name])=>{ const e=document.createElement('div');e.className='item';e.draggable=true;e.dataset.key=icon;e.setAttribute('aria-label',name);e.textContent=icon; bindItem(e);items.append(e); });
      message.textContent=level===1?'Match every treasure to its cozy shelf!':'Level '+level+' of '+totalLevels+' — keep the magic tidy!';
    }
    function bindItem(e){
      e.addEventListener('dragstart',()=>{dragged=e;e.classList.add('dragging')});e.addEventListener('dragend',()=>e.classList.remove('dragging'));
      e.addEventListener('pointerdown',ev=>{dragged=e;e.setPointerCapture?.(ev.pointerId);e.classList.add('dragging')});
      e.addEventListener('pointerup',ev=>{e.classList.remove('dragging'); const at=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.slot'); if(at) drop(at); });
    }
    shelf.addEventListener('dragover',e=>{e.preventDefault();e.target.closest('.slot')?.classList.add('over')});
    shelf.addEventListener('dragleave',e=>e.target.closest('.slot')?.classList.remove('over'));
    shelf.addEventListener('drop',e=>{e.preventDefault();drop(e.target.closest('.slot'))});
    function drop(slot){ if(!active||!dragged||slot.classList.contains('done'))return; document.querySelectorAll('.slot').forEach(x=>x.classList.remove('over'));
      if(slot.dataset.key===dragged.dataset.key){ const p=document.createElement('div');p.className='placed';p.textContent=dragged.textContent;slot.innerHTML='';slot.append(p);slot.classList.add('done');dragged.remove();score+=10*level;$('score').textContent=score;message.textContent='Perfect spot! ✨';sound('good');spark(slot); if(!items.children.length) complete(); }
      else { message.textContent='Almost! Find the matching picture.'; sound('bad'); }
      dragged=null;
    }
    function spark(el){ const r=el.getBoundingClientRect(), st=$('stage').getBoundingClientRect(); for(let i=0;i<6;i++){const x=document.createElement('i');x.className='spark';x.textContent=['✦','✿','•'][i%3];x.style.left=(r.left-st.left+r.width/2)+'px';x.style.top=(r.top-st.top+r.height/2)+'px';x.style.setProperty('--x',(Math.random()*90-45)+'px');x.style.setProperty('--y',(Math.random()*-90-10)+'px');$('stage').append(x);setTimeout(()=>x.remove(),700)} }
    function tick(){ seconds--; $('time').textContent=seconds; if(seconds<=0) finish(false); }
    function startGame(){ level=1;score=0;seconds=60;active=true;$('score').textContent=0;$('level').textContent=1;$('time').textContent=60;$('modal').hidden=true;clearInterval(timer);timer=setInterval(tick,1000);render(); }
    function complete(){ if(level<totalLevels){ active=false;clearInterval(timer);setTimeout(()=>{level++;seconds=60;$('level').textContent=level;$('time').textContent=seconds;active=true;render();timer=setInterval(tick,1000);},700); } else finish(true); }
    function finish(won){active=false;clearInterval(timer);$('modalTitle').textContent=won?'Shelf perfection!':'Time for a tea break';$('modalText').textContent=won?'You tidied all '+totalLevels+' shelves and scored '+score+' points!':'You scored '+score+' points. A cozy second try awaits!';$('start').textContent='Play again';$('modal').hidden=false;sound(won?'good':'bad');}
    $('start').onclick=startGame; $('restart').onclick=startGame;
  </script>
